  </g>
  <rect x="80" y="490" width="1040" height="80" rx="14" fill="#0d0c0b" stroke="#34302b" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30">
    <text x="112" y="541" fill="#f0955f">&#8250;</text>
    <text x="146" y="541" fill="#f2efe9">/plugin install task --marketplace qiqll/claude-task</text>
  </g>
</svg>
