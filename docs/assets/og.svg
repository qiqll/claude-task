<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Export to assets/og.png at 1200x630 for og:image / twitter:image. -->
  <rect width="1200" height="630" fill="#12110f"/>
  <rect x="0" y="0" width="12" height="630" fill="#f0955f"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#f0955f" font-size="28" font-weight="700">
    <text x="80" y="110">claude-task</text>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="700" fill="#f2efe9">
    <text x="80" y="230" font-size="68">Turn Claude Code from</text>
    <text x="80" y="310" font-size="68">an assistant into a</text>
    <text x="80" y="390" font-size="68" fill="#f0955f">delivery team</text>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#b3ada3" font-size="28">
